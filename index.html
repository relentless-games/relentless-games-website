<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Relentless Games</title>
    <meta name="description" content="Relentless Games is building Sprinkles, a funny MR game for Meta Quest. Meet the team and follow our journey." />
    <meta property="og:title" content="Relentless Games" />
    <meta property="og:description" content="A small, scrappy studio building funny MR experiences." />
    <meta property="og:image" content="/images/Relentless_Games_Logo.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Handles SPA routing on GitHub Pages 404.html redirects
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
